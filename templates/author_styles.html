<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Styles Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background:#0f1115; color:#e8eaed; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:28px 20px; }
        .wrap { max-width:1100px; margin:0 auto; }
        h1 { font-weight:800; }
        .subtitle { color:#9aa0a6; margin-bottom:28px; }

        /* Cards grid */
        .styles-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; margin-bottom:32px; }
        .style-card {
            background:#1a1d23; border:1px solid #2e3138; border-radius:14px;
            padding:20px; display:flex; flex-direction:column; gap:10px;
        }
        .style-card .card-name { font-size:18px; font-weight:700; }
        .style-card .card-meta { color:#9aa0a6; font-size:13px; }
        .style-card .card-desc { font-size:14px; color:#c5c8ce; line-height:1.5; flex:1; }
        .style-card .card-actions { display:flex; gap:8px; margin-top:6px; }

        /* Buttons */
        .btn-edit   { background:#2563eb; border:none; color:#fff; padding:6px 16px; border-radius:8px; font-size:13px; cursor:pointer; }
        .btn-edit:hover { background:#1d4ed8; }
        .btn-delete { background:#dc2626; border:none; color:#fff; padding:6px 16px; border-radius:8px; font-size:13px; cursor:pointer; }
        .btn-delete:hover { background:#b91c1c; }
        .btn-add {
            background:linear-gradient(135deg,#16a085,#1abc9c); border:none; color:#fff;
            padding:14px 32px; border-radius:12px; font-size:16px; font-weight:700;
            cursor:pointer; box-shadow:0 6px 20px rgba(26,188,156,.35); margin-bottom:28px;
            display:inline-flex; align-items:center; gap:8px;
        }
        .btn-add:hover { box-shadow:0 8px 28px rgba(26,188,156,.5); transform:translateY(-1px); }
        .btn-save { background:#16a085; border:none; color:#fff; padding:10px 28px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
        .btn-save:hover { background:#1abc9c; }
        .btn-cancel { background:#374151; border:none; color:#e8eaed; padding:10px 22px; border-radius:10px; font-size:15px; cursor:pointer; }
        .btn-cancel:hover { background:#4b5563; }

        /* Modal */
        .modal-overlay {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,.75);
            z-index:1000; align-items:center; justify-content:center;
        }
        .modal-overlay.open { display:flex; }
        .modal-box {
            background:#1a1d23; border:1px solid #2e3138; border-radius:18px;
            padding:32px; width:100%; max-width:680px; max-height:90vh;
            overflow-y:auto; position:relative;
        }
        .modal-box h2 { font-weight:800; margin-bottom:20px; }
        .modal-close { position:absolute; top:18px; right:22px; background:none; border:none; color:#9aa0a6; font-size:22px; cursor:pointer; line-height:1; }
        .modal-close:hover { color:#e8eaed; }

        /* Form fields */
        label { display:block; font-size:13px; color:#9aa0a6; margin-bottom:4px; margin-top:14px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
        input[type=text], textarea, select {
            width:100%; background:#0f1115; border:1px solid #3a3f4a; border-radius:9px;
            color:#e8eaed; padding:10px 13px; font-size:14px; outline:none;
            transition:border-color .15s;
        }
        input[type=text]:focus, textarea:focus { border-color:#1abc9c; }
        textarea { resize:vertical; min-height:80px; }
        .field-hint { font-size:12px; color:#6b7280; margin-top:3px; }
        .slug-preview { font-size:12px; color:#1abc9c; margin-top:3px; }

        /* Toast */
        .toast {
            position:fixed; bottom:24px; right:24px; background:#16a085; color:#fff;
            padding:12px 22px; border-radius:10px; font-weight:600; opacity:0;
            transition:opacity .3s; z-index:2000; pointer-events:none;
        }
        .toast.error { background:#dc2626; }
        .toast.show { opacity:1; }

        /* Empty state */
        .empty { text-align:center; padding:60px 20px; color:#6b7280; }
        .empty i { font-size:48px; display:block; margin-bottom:16px; }

        /* Pill badges */
        .pill { display:inline-block; background:#2e3138; color:#9aa0a6; border-radius:20px; padding:2px 10px; font-size:12px; margin-right:4px; }

        /* Back link */
        .back-link { color:#9aa0a6; text-decoration:none; font-size:14px; display:inline-flex; align-items:center; gap:5px; margin-bottom:20px; }
        .back-link:hover { color:#e8eaed; }

        .char-count { font-size:12px; color:#6b7280; text-align:right; margin-top:2px; }
    </style>
</head>
<body>
<div class="wrap">
    <a class="back-link" href="/"><i class="bi bi-arrow-left"></i> Back to app</a>
    <h1><i class="bi bi-pen" style="color:#1abc9c"></i> Author Styles Manager</h1>
    <p class="subtitle">Add and manage author style samples. The rewrite engine uses the Style Prompt when applying a style.</p>

    <button class="btn-add" onclick="openModal()">
        <i class="bi bi-plus-circle-fill"></i> Add New Author Style
    </button>

    <div id="stylesGrid" class="styles-grid">
        <div class="empty"><i class="bi bi-hourglass"></i>Loading…</div>
    </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal()">×</button>
        <h2 id="modalTitle">Add Author Style</h2>

        <label>Author Name *</label>
        <input type="text" id="fName" placeholder="e.g. Hunter S. Thompson" oninput="autoSlug()">

        <label>Slug (URL key) *</label>
        <input type="text" id="fSlug" placeholder="auto-generated from name">
        <div class="slug-preview" id="slugPreview"></div>

        <label>Genre</label>
        <input type="text" id="fGenre" placeholder="e.g. Gonzo Journalism, Literary Fiction">

        <label>Era</label>
        <input type="text" id="fEra" placeholder="e.g. 20th Century, Contemporary">

        <label>Short Description</label>
        <textarea id="fDesc" rows="2" placeholder="One or two sentences shown in the style picker…"></textarea>

        <label>Style Prompt * <span style="color:#6b7280;font-weight:400;text-transform:none">(injected directly into the rewrite prompt)</span></label>
        <textarea id="fPrompt" rows="5" placeholder="Rewrite this in [Author]'s style: …" oninput="updateCount()"></textarea>
        <div class="char-count" id="promptCount">0 chars</div>
        <div class="field-hint">Be specific. Describe sentence structure, vocabulary, tone, techniques, rhythm, what to avoid, etc.</div>

        <label>Sample Passage <span style="color:#6b7280;font-weight:400;text-transform:none">(optional — shown as a reference example)</span></label>
        <textarea id="fSample" rows="4" placeholder="A short passage that exemplifies this author's style…"></textarea>

        <div style="display:flex;gap:10px;margin-top:22px;">
            <button class="btn-save" id="saveBtn" onclick="saveStyle()">Save</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
        <input type="hidden" id="editSlug">
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
let allStyles = [];

// ── Load ──────────────────────────────────────────────────────────────
async function loadStyles() {
    try {
        const r = await fetch('/api/author_styles');
        allStyles = await r.json();
        renderGrid(allStyles);
    } catch(e) {
        showToast('Failed to load styles', true);
    }
}

function renderGrid(styles) {
    const grid = document.getElementById('stylesGrid');
    if (!styles.length) {
        grid.innerHTML = '<div class="empty"><i class="bi bi-journal-text"></i>No author styles yet. Add your first one above.</div>';
        return;
    }
    grid.innerHTML = styles.map(s => `
        <div class="style-card">
            <div class="card-name">${esc(s.name)}</div>
            <div class="card-meta">
                ${s.genre ? `<span class="pill">${esc(s.genre)}</span>` : ''}
                ${s.era   ? `<span class="pill">${esc(s.era)}</span>`   : ''}
                <span class="pill" style="color:#1abc9c">${esc(s.slug)}</span>
            </div>
            ${s.description ? `<div class="card-desc">${esc(s.description)}</div>` : ''}
            ${s.sample_text ? `<div class="card-desc" style="font-style:italic;color:#9aa0a6;font-size:13px;border-left:3px solid #2e3138;padding-left:10px;margin-top:4px">${esc(s.sample_text.substring(0,160))}${s.sample_text.length>160?'…':''}</div>` : ''}
            <div class="card-actions">
                <button class="btn-edit"   onclick="editStyle('${esc(s.slug)}')"><i class="bi bi-pencil"></i> Edit</button>
                <button class="btn-delete" onclick="deleteStyle('${esc(s.slug)}', '${esc(s.name)}')"><i class="bi bi-trash"></i> Delete</button>
            </div>
        </div>
    `).join('');
}

// ── Modal helpers ──────────────────────────────────────────────────────
function openModal(mode='add') {
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('modalTitle').textContent = mode === 'edit' ? 'Edit Author Style' : 'Add Author Style';
    document.getElementById('saveBtn').textContent = mode === 'edit' ? 'Save Changes' : 'Save';
    if (mode === 'add') clearForm();
}
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
}
function clearForm() {
    ['fName','fSlug','fGenre','fEra','fDesc','fPrompt','fSample','editSlug'].forEach(id => document.getElementById(id).value='');
    document.getElementById('slugPreview').textContent = '';
    document.getElementById('promptCount').textContent = '0 chars';
}

// ── Slug auto-generation ───────────────────────────────────────────────
function autoSlug() {
    const name = document.getElementById('fName').value;
    const editSlug = document.getElementById('editSlug').value;
    if (editSlug) return;  // don't auto-change slug when editing
    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
    document.getElementById('fSlug').value = slug;
    document.getElementById('slugPreview').textContent = slug ? `Key: "${slug}"` : '';
}

function updateCount() {
    const len = document.getElementById('fPrompt').value.length;
    document.getElementById('promptCount').textContent = len + ' chars';
}

// ── Save ───────────────────────────────────────────────────────────────
async function saveStyle() {
    const editSlug = document.getElementById('editSlug').value;
    const name = document.getElementById('fName').value.trim();
    const slug = document.getElementById('fSlug').value.trim();
    const prompt = document.getElementById('fPrompt').value.trim();

    if (!name)   { showToast('Author name is required', true); return; }
    if (!slug)   { showToast('Slug is required', true); return; }
    if (!prompt) { showToast('Style prompt is required', true); return; }

    const body = {
        name,
        slug,
        genre:       document.getElementById('fGenre').value.trim(),
        era:         document.getElementById('fEra').value.trim(),
        description: document.getElementById('fDesc').value.trim(),
        style_prompt: prompt,
        sample_text: document.getElementById('fSample').value.trim(),
        is_active: true,
    };

    try {
        let r;
        if (editSlug) {
            r = await fetch(`/api/author_styles/${editSlug}`, { method:'PUT',  headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
        } else {
            r = await fetch('/api/author_styles',             { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
        }
        const data = await r.json();
        if (!r.ok) { showToast(data.error || 'Save failed', true); return; }
        closeModal();
        showToast(editSlug ? 'Style updated!' : 'Style added!');
        await loadStyles();
    } catch(e) {
        showToast('Network error', true);
    }
}

// ── Edit ───────────────────────────────────────────────────────────────
function editStyle(slug) {
    const s = allStyles.find(x => x.slug === slug);
    if (!s) return;
    openModal('edit');
    document.getElementById('fName').value    = s.name || '';
    document.getElementById('fSlug').value    = s.slug || '';
    document.getElementById('fGenre').value   = s.genre || '';
    document.getElementById('fEra').value     = s.era || '';
    document.getElementById('fDesc').value    = s.description || '';
    document.getElementById('fPrompt').value  = s.style_prompt || '';
    document.getElementById('fSample').value  = s.sample_text || '';
    document.getElementById('editSlug').value = s.slug;
    document.getElementById('slugPreview').textContent = `Key: "${s.slug}"`;
    updateCount();
}

// ── Delete ─────────────────────────────────────────────────────────────
async function deleteStyle(slug, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    try {
        const r = await fetch(`/api/author_styles/${slug}`, { method:'DELETE' });
        if (!r.ok) { const d=await r.json(); showToast(d.error||'Delete failed',true); return; }
        showToast('Style deleted');
        await loadStyles();
    } catch(e) {
        showToast('Network error', true);
    }
}

// ── Toast ──────────────────────────────────────────────────────────────
function showToast(msg, isError=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Util ───────────────────────────────────────────────────────────────
function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

loadStyles();
</script>
</body>
</html>
