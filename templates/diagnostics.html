<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostics — CLASSIC EZ READER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #0f1115;
            color: #e8eaed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
        }
        .wrap { max-width: 980px; margin: 0 auto; }
        h1 { font-weight: 800; letter-spacing: 0.5px; }
        .subtitle { color: #9aa0a6; margin-bottom: 24px; }
        .run-btn {
            display: block;
            width: 100%;
            padding: 22px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            border: none;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, #16a085 0%, #1abc9c 100%);
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(26,188,156,0.35);
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .run-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(26,188,156,0.45); }
        .run-btn:disabled { opacity: .7; cursor: progress; }
        .summary {
            display: flex; gap: 14px; flex-wrap: wrap;
            margin: 26px 0 10px;
        }
        .stat {
            flex: 1; min-width: 130px;
            background: #1a1d24; border-radius: 12px; padding: 16px; text-align: center;
            border: 1px solid #262a33;
        }
        .stat .num { font-size: 30px; font-weight: 800; }
        .stat .lbl { color: #9aa0a6; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .stat.pass .num { color: #2ecc71; }
        .stat.fail .num { color: #e74c3c; }
        .stat.warn .num { color: #f1c40f; }
        .stat.total .num { color: #5dade2; }
        .category-title {
            margin: 26px 0 10px; font-size: 14px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px; color: #7f8c8d;
            border-bottom: 1px solid #262a33; padding-bottom: 6px;
        }
        .check {
            display: flex; align-items: center; gap: 14px;
            background: #1a1d24; border: 1px solid #262a33;
            border-left: 4px solid #555; border-radius: 10px;
            padding: 12px 16px; margin-bottom: 8px;
        }
        .check.pass { border-left-color: #2ecc71; }
        .check.fail { border-left-color: #e74c3c; }
        .check.warn { border-left-color: #f1c40f; }
        .check .icon { font-size: 22px; }
        .check.pass .icon { color: #2ecc71; }
        .check.fail .icon { color: #e74c3c; }
        .check.warn .icon { color: #f1c40f; }
        .check .body { flex: 1; min-width: 0; }
        .check .name { font-weight: 700; }
        .check .msg { color: #9aa0a6; font-size: 13px; word-break: break-word; }
        .check .ms { color: #5f6368; font-size: 12px; white-space: nowrap; }
        .spinner-wrap { text-align: center; padding: 40px; color: #9aa0a6; }
        .back-link { color: #5dade2; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="/" class="back-link"><i class="bi bi-arrow-left"></i> Back to app</a>
        <h1 class="mt-3"><i class="bi bi-activity"></i> System Diagnostics</h1>
        <p class="subtitle">One click verifies every API key and every core function in the app.</p>

        <button id="runBtn" class="run-btn">
            <i class="bi bi-play-circle"></i> RUN FULL DIAGNOSTIC
        </button>

        <div id="output"></div>
    </div>

    <script>
        const runBtn = document.getElementById('runBtn');
        const output = document.getElementById('output');

        const ICONS = {
            pass: 'bi-check-circle-fill',
            fail: 'bi-x-circle-fill',
            warn: 'bi-exclamation-triangle-fill'
        };

        function render(data) {
            const s = data.summary;
            let html = '';

            html += '<div class="summary">';
            html += statCard('total', s.total, 'Total');
            html += statCard('pass', s.passed, 'Passed');
            html += statCard('fail', s.failed, 'Failed');
            html += statCard('warn', s.warnings, 'Warnings');
            html += '</div>';
            html += '<p class="subtitle" style="text-align:center;">Completed in ' + (data.elapsed_ms/1000).toFixed(1) + 's</p>';

            // Group by category preserving order
            const groups = {};
            const groupOrder = [];
            data.results.forEach(r => {
                if (!groups[r.category]) { groups[r.category] = []; groupOrder.push(r.category); }
                groups[r.category].push(r);
            });

            groupOrder.forEach(cat => {
                html += '<div class="category-title">' + escapeHtml(cat) + '</div>';
                groups[cat].forEach(r => {
                    html += '<div class="check ' + r.status + '">';
                    html += '<i class="icon bi ' + ICONS[r.status] + '"></i>';
                    html += '<div class="body">';
                    html += '<div class="name">' + escapeHtml(r.name) + '</div>';
                    html += '<div class="msg">' + escapeHtml(r.message) + '</div>';
                    html += '</div>';
                    html += '<div class="ms">' + r.ms + ' ms</div>';
                    html += '</div>';
                });
            });

            output.innerHTML = html;
        }

        function statCard(cls, num, lbl) {
            return '<div class="stat ' + cls + '"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        runBtn.addEventListener('click', async () => {
            runBtn.disabled = true;
            runBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> RUNNING ALL CHECKS...';
            output.innerHTML = '<div class="spinner-wrap"><div class="spinner-border text-info" role="status"></div><div class="mt-3">Testing every provider and function. This can take up to a minute…</div></div>';

            try {
                const response = await fetch('/run_diagnostics', { method: 'POST' });
                if (!response.ok) {
                    let msg = 'HTTP ' + response.status;
                    try { const j = await response.json(); if (j.error) msg = j.error; } catch (e) {}
                    throw new Error(msg);
                }
                const data = await response.json();
                render(data);
            } catch (err) {
                output.innerHTML = '<div class="check fail"><i class="icon bi bi-x-circle-fill"></i><div class="body"><div class="name">Diagnostic run failed</div><div class="msg">' + escapeHtml(err.message) + '</div></div></div>';
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = '<i class="bi bi-play-circle"></i> RUN FULL DIAGNOSTIC';
            }
        });
    </script>
</body>
</html>
